name: Verificação

on:
  pull_request:
  push:
    branches: [main]

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo export --platform web
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://exemplo.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: chave-de-teste

  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/tuya/index.ts supabase/functions/snapshot/index.ts
