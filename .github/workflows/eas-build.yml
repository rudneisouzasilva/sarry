name: Gerar APK (EAS)

# Gera o APK de Android no EAS Build. Rode em Actions > Gerar APK (EAS) > Run workflow.
# Segredo necessário: EXPO_TOKEN (expo.dev > Account settings > Access tokens).
on:
  workflow_dispatch:
    inputs:
      profile:
        description: Perfil do eas.json
        default: preview
        type: choice
        options: [preview, production]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - run: eas build --platform android --profile ${{ inputs.profile }} --non-interactive --no-wait
