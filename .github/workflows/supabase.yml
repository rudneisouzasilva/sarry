name: Publicar Supabase

# Aplica as migrações do banco e publica as Edge Functions.
# Segredos do repositório (Settings > Secrets and variables > Actions):
#   SUPABASE_ACCESS_TOKEN  (supabase.com > Account > Access Tokens)
#   SUPABASE_PROJECT_ID    (o "Reference ID" do projeto)
#   SUPABASE_DB_PASSWORD   (senha do banco definida ao criar o projeto)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['supabase/**']

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
      - run: supabase db push
      - run: supabase functions deploy tuya snapshot --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
